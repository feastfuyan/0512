# 代码审查 Agent 配置文件
# 修改此文件即可调整审查行为，无需改代码

repos:
  - name: monorepo
    url: https://github.com/lynaimining/lynai-miningclawd-monorepo
    local: ${TMPDIR:-/tmp}/code-review-mono
    description: Mining Claw 主仓库（BFF/前端/后端）
  - name: data-pipeline
    url: https://github.com/lynaimining/lynai-miningclawd-data-pipeline
    local: ${TMPDIR:-/tmp}/code-review-data
    description: 数据管道（爬虫/数据清洗/技能）
  - name: skills
    url: https://github.com/lynaimining/LynAI-skills
    local: ${TMPDIR:-/tmp}/code-review-skills
    description: 技能仓库（可选）

developers:
  - name: 夏童
    github: xiatong
    alias: [acxt, cxt, 陈夏彤, 陈夏彤·数字力场]
    role: 后端/DevOps/支付
  - name: 薛娴
    github: xuexiansc-bit
    alias: [xian, 薛娴]
    role: BFF/前端地图/数据契约
  - name: 林素雅
    github: Linsuya
    alias: [KIP, 素雅, 林素雅]
    role: 前端/数据清洗/UI
  - name: 慧怡
    github: huiyi
    alias: [冬末, 杜慧仪, 杜慧怡]
    role: 数据管道/钻孔数据/爬虫

# 多模型审查配置
agents:
  security:
    model: newapi2/claude-sonnet-4-5
    label: 安全与合规
    dimensions:
      - 硬编码检测
      - 明文密码/密钥
      - SQL注入/XSS/CSRF
      - .gitignore完整性
      - 敏感信息泄露
    prompt_file: agent-prompt.md

  architecture:
    model: zai/glm-5
    label: 架构与工程
    dimensions:
      - 代码结构与模块化
      - 设计模式与配置外部化
      - CI/CD接入
      - 测试覆盖
      - 研发文档完整性
    prompt_file: agent-prompt.md

  logic:
    model: deepseek/deepseek-v4-pro
    label: 逻辑与规范
    dimensions:
      - 业务逻辑正确性
      - 错误处理与边界
      - Commit规范与颗粒度
      - AG任务编号
      - PR规范
    prompt_file: agent-prompt.md

# 11维评分权重（满分110）
scoring:
  dimensions:
    - { name: 沟通响应, weight: 10, group: 个人表现 }
    - { name: 时间投入, weight: 10, group: 个人表现 }
    - { name: 代码质量, weight: 10, group: 个人表现 }
    - { name: 效率, weight: 10, group: 个人表现 }
    - { name: 团队协作, weight: 10, group: 个人表现 }
    - { name: 测试覆盖, weight: 10, group: 安全质量 }
    - { name: 安全合规, weight: 10, group: 安全质量 }
    - { name: AG任务编号, weight: 10, group: 工程规范 }
    - { name: CI接入, weight: 10, group: 工程规范 }
    - { name: Commit颗粒度, weight: 10, group: 工程规范 }
    - { name: 开发日志, weight: 10, group: 工程规范 }

  grades:
    - { min: 90, grade: "S", label: "卓越" }
    - { min: 80, grade: "A", label: "优秀" }
    - { min: 70, grade: "B+", label: "良好+" }
    - { min: 60, grade: "B", label: "良好" }
    - { min: 0, grade: "D", label: "不合格" }

# 必查红线（一票降级）
red_lines:
  - { name: 硬编码, desc: "IP/端口/URL/路径/阈值常量散落在代码里" }
  - { name: 明文密码, desc: "API key/数据库密码/token 直接写在代码或 config 文件里" }
  - { name: 研发残留, desc: "console.log/print/debugger/注释掉的代码残留" }
  - { name: 零测试, desc: "任何PR完全没有测试文件" }

output:
  excel_dir: ~/Desktop/MC周报/weekly
  template: ~/Desktop/MC周报/weekly/代码审查模板.xlsx
  naming: "{date}_代码审查报告.xlsx"
