# geopolitics-report / institutional-rubric.yaml
# v3.0 — 对齐 01/02 架构, 地缘政治专用维度

meta:
  version: v3.0.0
  effective_from: '2026-07-15'
  gate_threshold: 9.5
  total_gate_threshold: 9.0
  max_rounds: 3
  on_max_rounds_fail: watermark_and_publish
  compliance_floor_enabled: true
  scoring_method: hybrid
  llm_weight: 0.6
  mechanical_weight: 0.4
dimensions:
- id: event_coverage
  name_zh: 事件覆盖度
  name_en: Event Coverage
  weight: 0.2
  description: 地缘事件覆盖完整; 按区域/类型/矿种分类; 每章 ≥3 条事件; 时间线清晰.
  anchors:
    '10.0': 全区域覆盖, 每章 ≥5 条事件含 src_line, 时间线完整.
    '9.5': ≥90% 区域覆盖, 每章 ≥3 条事件.
    '9.0': ≥80% 覆盖, 1 个核心区域缺失.
    '7.0': 事件罗列为主, 缺分类和时间线.
    '5.0': 大量区域缺失或事件无来源.
  mechanical_checks:
  - id: event_count_check
    method: regex_count
    pattern: (?:event-timeline|geo-event|<div class="event-item")
    rule: 事件时间线或事件卡片 ≥5 个
    weight_in_dim: 0.3
  - id: region_coverage_check
    method: regex_count
    pattern: (?:Middle East|East Asia|South Asia|Africa|South America|North America|Europe|Central Asia|Southeast Asia)
    rule: 覆盖 ≥5 个区域
    weight_in_dim: 0.3
  - id: severity_classification
    method: regex_count
    pattern: (?:Critical|High|Medium|Low)\s*(?:risk|severity|impact)
    rule: 必须有风险等级分类
    weight_in_dim: 0.2
  - id: commodity_linkage
    method: regex_count
    pattern: (?:oil|copper|gold|iron ore|lithium|rare earth|uranium|nickel|cobalt)
    rule: 事件必须关联到矿种
    weight_in_dim: 0.2
  llm_checks:
  - id: event_analysis_depth
    weight_in_dim: 1.0
    prompt_fragment: 检查事件是否有背景分析、影响评估和因果链条; 不是简单罗列.
- id: analytical_depth
  name_zh: 分析深度
  name_en: Analytical Depth
  weight: 0.2
  description: CRI 五维框架使用; P×I 矩阵; 情景分析 (bull/bear/base); 传染路径分析.
  anchors:
    '10.0': CRI 五维完整 + P×I 矩阵 + 情景分析 + 传染路径, 论证链条完整.
    '9.5': ≥90% 章节有 CRI 维度分析 + 情景分析.
    '9.0': ≥80% 有分析框架, 1 处断点.
    '7.0': 描述为主, 缺分析框架.
    '5.0': 无 CRI / P×I / 情景分析.
  mechanical_checks:
  - id: cri_framework_present
    method: regex_count
    pattern: (?:CRI|Country Risk Index|D1|D2|D3|D4|D5|五维|five.dimension)
    rule: CRI 五维框架必须出现
    weight_in_dim: 0.3
  - id: scenario_grid_present
    method: regex_count
    pattern: class="scenario-card|class="scenario-grid
    rule: 必须有情景分析 (Bull/Base/Bear)
    weight_in_dim: 0.3
  - id: impact_matrix_present
    method: regex_count
    pattern: (?:impact.*probabilit|P.*×.*I|概率.*影响|risk.*matrix)
    rule: P×I 风险矩阵
    weight_in_dim: 0.2
  - id: contagion_analysis
    method: regex_count
    pattern: (?:contagion|传染|spillover|cascad|传导链|ripple.effect)
    rule: 传染路径分析
    weight_in_dim: 0.2
  llm_checks:
  - id: analytical_rigor
    weight_in_dim: 1.0
    prompt_fragment: 检查分析是否有因果推理; CRI 评分是否与事件数据一致; 情景概率是否合理.
- id: geopolitical_rigor
  name_zh: 地缘政治严谨性
  name_en: Geopolitical Rigor
  weight: 0.15
  description: 图表配色命中规范 + 分辨率 + Source 标注; 事件因果链准确; 制裁/政策引用有出处.
  anchors:
    '10.0': 所有图表达标 + 因果链准确 + 政策/制裁引用全部有出处.
    '9.5': ≥90% 图表达标, 1-2 处因果链可优化.
    '5.0': 使用禁用图表库.
  mechanical_checks:
  - id: chart_image_present
    method: regex_count
    pattern: (?:<img[^>]+class="chart"|<div[^>]+class="[^"]*chart-block[^"]*")
    rule: 每章 ≥1 图表
    weight_in_dim: 0.15
  - id: color_palette_whitelist
    method: hex_whitelist
    allowed_hexes:
    - '#14b8a6'
    - '#3b82f6'
    - '#f59e0b'
    - '#06b6d4'
    - '#f43f5e'
    - '#ef4444'
    - '#f87171'
    - '#6b7280'
    - '#374151'
    - '#22c55e'
    rule: ≥95% hex 在白名单
    weight_in_dim: 0.15
  - id: data_source_caption
    method: regex_count
    pattern: 数据来源[:：]|Source[:\s]
    rule: 每图有 Source 标注
    weight_in_dim: 0.15
  - id: no_chart_library
    method: negative_regex
    forbidden_patterns:
    - Chart\.js|chart\.min\.js|echarts|d3\.min\.js|plotly|quickchart\.io
    rule: 禁止使用图表库
    weight_in_dim: 0.1
  - id: figure_quality_score
    method: score_figure_svg
    rule: SVG 安全 + 数据标记 + 标注
    weight_in_dim: 0.15
  - id: chart_data_match_mech
    method: chart_data_match
    tolerance: 0.02
    rule: 图表数据与 data.json 一致 (2% tolerance)
    weight_in_dim: 0.15
  - id: policy_citation_check
    method: regex_count
    pattern: (?:Section 232|Order 61|RKAB|CRMA|IRA|OFAC|SDN|executive.order|sanctions.list)
    rule: 政策/制裁引用 ≥2 处
    weight_in_dim: 0.15
  llm_checks:
  - id: geopolitical_accuracy
    weight_in_dim: 1.0
    prompt_fragment: 检查地缘政治因果链是否准确; 制裁/关税影响评估是否合理.
- id: data_integrity
  name_zh: 数据完整性
  name_en: Data Integrity
  weight: 0.15
  description: 所有事件有 src_line; 无臆造数据; 制裁检查 fail-closed; COI 披露.
  anchors:
    '10.0': 所有事件有 src_line; 无臆造; COI 已披露; 制裁检查通过.
    '9.5': 1-2 个非核心字段缺失 (已在 missing[] 声明).
    '9.0': 3-5 个字段缺失.
    '7.0': 核心区域缺数据.
    '5.0': 大量数据缺失或臆造.
  mechanical_checks:
  - id: coi_disclosure
    method: regex_count
    pattern: 利益冲突|COI\s*disclosure|Conflict.of.Interest|No COI
    rule: 如涉及, 必须有 COI 章节
    weight_in_dim: 0.4
  - id: ai_generated_badge
    method: regex_count
    pattern: AI GENERATED|ai-badge
    rule: 必须有 AI 生成声明
    weight_in_dim: 0.3
  - id: no_marketing_violation
    method: negative_regex_strict
    forbidden_patterns:
    - MNPI|material.non.public.information
    - guaranteed.return|risk.free.investment|sure.fire.profit
    - inside.information|confidential.tip
    rule: 无 MNPI / 营销违规
    weight_in_dim: 0.3
  llm_checks:
  - id: data_completeness
    weight_in_dim: 1.0
    prompt_fragment: 检查 missing[] 是否透明声明; 是否有臆造数据.
- id: structure_compliance
  name_zh: 版式合规
  name_en: Structure Compliance
  weight: 0.15
  description: 封面光效 + 目录 + 封底 + 无溢出 + 字号投行标准.
  anchors:
    '10.0': 所有页符合投行版式规范, 无溢出, 封面 + 封底完整, 侧栏数据齐备.
    '9.5': 整体优秀, 仅 1-2 页有微小溢出或侧栏字数超限.
    '9.0': 3-5 页有小问题.
    '7.0': 缺封底 OR 大段内容溢出.
    '5.0': 无法识别版式风格.
  mechanical_checks:
  - id: back_cover_present
    method: regex_count
    pattern: <div class="page back-cover">
    rule: 必须存在 .back-cover
    if_zero: score -= 3.0
    weight_in_dim: 0.2
  - id: table_of_contents_present
    method: regex_count
    pattern: Contents|Table of Contents
    rule: 必须有目录页
    if_zero: score -= 2.0
    weight_in_dim: 0.15
  - id: cover_glow_layers
    method: regex_count
    pattern: <div class="glow[123]">
    rule: 封面光效 .glow1/2/3 至少 1 个
    weight_in_dim: 0.1
  - id: font_size_compliance
    method: css_check
    rules:
    - '正文 font-size: 11.5px ± 0.5px'
    - 'h2 font-size: 17px ± 1px'
    - 'h3 font-size: 13.5px ± 1px'
    weight_in_dim: 0.15
  - id: page_break_consistency
    method: css_check
    rule: '所有 .page 有 page-break-after; .back-cover 有 page-break-after: auto'
    weight_in_dim: 0.2
  - id: no_overflow_after_fixOverflow
    method: playwright_check
    rule: 调用 fixOverflow 后, 再次扫描溢出元素数 = 0
    weight_in_dim: 0.2
  llm_checks: []
- id: language_quality
  name_zh: 语言质量与合规
  name_en: Language Quality & Compliance
  weight: 0.15
  hard_floor: true
  description: 英文专业流畅; 无营销违规; 制裁检查 fail-closed; 风险对称; 免责声明完整.
  anchors:
    '10.0': 英文专业流畅, 无敏感词, 风险对称, 免责完整.
    '9.5': 1-2 处边缘措辞.
    '7.0': 明显违规 (内幕暗示).
    '3.0': 涉及制裁实体未披露.
  mechanical_checks:
  - id: sanctions_entity_check
    method: entity_list_check
    list_path: shared/sanctions-list.json
    rule: 无未标注 [SANCTIONED] 的制裁实体
    weight_in_dim: 0.3
  - id: disclaimer_present
    method: regex_count
    pattern: Disclaimer|免责声明
    rule: 必须有免责声明
    weight_in_dim: 0.15
  - id: ai_generated_disclosure
    method: regex_count
    pattern: AI Disclosure|AI声明|AI GENERATED
    rule: 必须有 AI 声明
    weight_in_dim: 0.15
  - id: risk_box_per_chapter
    method: regex_count
    pattern: class="risk-box"
    rule: 每章 ≥1 个 risk-box
    weight_in_dim: 0.2
  - id: risk_keyword_coverage
    method: regex_count
    keywords:
    - 地缘|geopolitic
    - 制裁|sanction|OFAC
    - 关税|tariff|trade.war
    - 冲突|conflict|escalat
    - 供应链|supply.chain
    - 价格.{0,10}下行|price.{0,10}downside
    rule: matches ≥ 3 类
    weight_in_dim: 0.2
  llm_checks:
  - id: risk_symmetry
    weight_in_dim: 0.0
    prompt_fragment: 检查每章是否双向论述.
degraded_output:
  enabled: true
  watermark_format: '[未达 9.5: {failed_list_with_scores}] · MiningClaw · {report_id}'
  watermark_color: '#9ca3af'
  watermark_size_px: 9
  watermark_position: bottom-right-each-page
  also_inject_into_disclaimer: true
  audit_status: DEGRADED
failure_dispatch:
  event_coverage:
  - data-collector
  - content-writer
  analytical_depth:
  - content-writer
  geopolitical_rigor:
  - visual-designer
  - content-writer
  data_integrity:
  - data-collector
  structure_compliance:
  - content-writer
  language_quality:
  - content-writer
