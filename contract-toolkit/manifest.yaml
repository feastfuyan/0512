# ==============================================================================
# contract-toolkit — Skill 顶层 Manifest
#
# 字段结构参照 WorkBuddy 内置技能同款规范《CSIG Skill 管理与发布规范 V1.0》§5.2
# （样例来源：workbuddy-builtin/skills/library/manifest.yaml）
#
# 渠道说明：
#   · WorkBuddy / CSIG 渠道 —— 读取本文件作为机器可读元数据
#   · SkillHub 渠道 —— 必填元信息在 SKILL.md frontmatter（slug / version /
#     displayName），与本文件并存互不冲突
# ==============================================================================

# --- §5.2 必填字段 -------------------------------------------------------------
name: contract-toolkit
display_name: 合同要素台账
version: 1.0.2
description: 把散落的合同文件变成可核对的结构化台账。批量解析 PDF（含文本层）、DOCX、TXT 与 Markdown 格式的合同，抽取合同编号与名称、我方角色与对方名称、合同金额、币种、税率、签订日期、生效日期、到期日期、合同期限、付款方式、质保金比例、违约金比例与争议解决方式，并从正文中拆出付款节点（节点名称 / 节点类型 / 比例 / 金额 / 约定时点），生成「合同台账 + 付款节点 + 抽取候选 + 解析告警」四 sheet 统一台账（xlsx / csv / 单文件 HTML 报告三种输出）；配套 check 按确定性规则做台账体检（付款节点金额合计与比例合计、日期逻辑链、金额为正、大写金额与数字金额一致、税率区间、关键字段完整性、到期状态），expire 生成按期分档的到期清单，compare 按对方或分组统计并暴露同批合同之间的条款不一致。目录默认递归子目录；置信度阈值可用 --conf-threshold 调整；我方名称支持 --our-name、环境变量 CONTRACT_OUR_NAME 与 .contract-toolkit.yaml 三种来源。**本技能只抽取与核对事实，不做条款风险审查、不判断合同效力、不出具法律意见**；当事人名称与合同金额的抽取在自由文本上有客观准确率上限，所有低置信度结果都会进入「待确认字段」列并在「抽取候选」sheet 保留全部落选候选供人工复核；扫描件不内置 OCR，请先用 pdf-toolkit 的 text --ocr 转文本。共 5 个子命令（info / parse / check / expire / compare），纯本地运行，合同数据不出机。当用户要求整理合同台账、合同要素提取、合同金额与期限汇总、合同到期提醒、合同清单、付款节点整理、合同体检、合同批量解析时使用。触发词包括合同台账、合同要素、合同解析、合同清单、合同到期、到期提醒、付款节点、合同金额提取、合同管理、合同汇总、合同体检、合同编号提取。不适用于：合同条款的法律风险审查、合同效力与续签判断、电子签署与用印流程、扫描件或拍照件的识别；不出具法律意见，不生成或修改任何合同文本内容。
author: 李振
level: personal                # personal | product；个人开发技能，按个人级发布

# --- §5.2 可选字段 -------------------------------------------------------------
license: MIT
data_classification: L3        # 敏感商业数据（合同条款与金额）；仅在本机读写用户指定路径，不联网、不外传

# --- 技能市场图标外链 ----------------------------------------------------------
# SkillHub 发布不会自动上传头像，需提供可公开访问的 PNG 直链。
# 该字段与 SKILL.md frontmatter 的 `homepage` 双写、必须一致 ——
# check_meta.py 负责校验，set_icon_url.py 一次改全两处，不要手改其中一处。
# 2026-10-07 已回填（图标已生成并发布到托管页，远端与本技能 assets/icon.png 逐字节一致）。

# --- 依赖声明（参照 §5.2 dependencies）-----------------------------------------
dependencies:
  runtime:
    - python>=3.10
  external: []

# --- Python 包清单（§5.2 之外的扩展键，解析器安全忽略）------------------------
x-packages:
  required:
    - pandas>=2.0
    - openpyxl>=3.1
  optional:
    - pypdf>=5.0            # 读取 PDF 合同的文本层（不做版式还原、不做 OCR）
    - python-docx>=1.1      # 读取 .docx 合同
    - pytest>=8.0           # 单元测试
  forbidden:
    - PyMuPDF               # AGPL，与本技能 MIT 声明冲突
    - easyofd               # 传递依赖 PyMuPDF，同样排除
    - pytesseract           # 本技能不做 OCR；扫描件走 pdf-toolkit 的 text --ocr
    - paddleocr             # 同上，且依赖体积过大
    - ollama                # 同上，不引入本地大模型

# --- 能力模块（按功能分组，非一个子命令一个模块）--------------------------------
modules:
  - id: parse
    title: 合同解析与台账生成
    entry: scripts/contract_toolkit.py parse
    status: implemented
    capabilities:
      - parse  # 输入：PDF（文本层）/ DOCX / TXT / MD，文件或目录（默认递归）
               # 流程：文本获取 → 区域切分（头部 / 条款正文 / 附件表格）
               #   → 候选抽取 → 打分消歧 → 置信度定级
               # --probe      单文件打印抽取详情（区域字数、逐字段结果、
               #              金额候选及得分、当事人候选、付款节点、告警）
               # --our-name   指定我方全称，用于准确区分甲乙方并定位对方名称
               # --dry-run    只统计不写文件，打印逐份的合同标识 / 对方 /
               #              金额 / 到期日 / 置信度简表
               # -v           逐文件打印处理状态
               # 输出：合同台账 + 付款节点 + 抽取候选 + 解析告警 四 sheet xlsx
               # 台账字段：合同标识 / 合同编号 / 合同名称 / 我方角色 / 对方名称 /
               #   统一社会信用代码 / 合同金额 / 币种 / 税率 / 签订日期 /
               #   生效日期 / 到期日期 / 合同期限(天) / 付款方式 / 质保金比例 /
               #   违约金比例 / 争议解决 / 源文件 / 置信度 / 待确认字段 / 处理状态
               # 关键设计：先捞全部候选再打分消歧，落选候选全部保留在
               #   「抽取候选」sheet —— 不做黑箱判定，每个取值都能追溯到原文片段
               # 目录模式下**不做扩展名过滤**：除隐藏文件与噪声目录外一律收进来，
               #   不支持的格式以「处理状态 = 不支持格式」各占一行台账并写明原因，
               #   保证「输入里有什么」与「台账里有几行」对得上

  - id: validate
    title: 台账体检（确定性规则）
    entry: scripts/contract_toolkit.py check
    status: implemented
    capabilities:
      - check  # 8 条规则：节点合计（付款节点金额合计 = 合同金额）/ 比例合计
               #   （付款节点比例合计 = 100%，扣留项不计入）/ 日期逻辑
               #   （签订 ≤ 生效 ≤ 到期）/ 金额为正 / 大写一致（中文大写金额与
               #   台账采纳金额一致）/ 税率区间 / 关键字段（对方名称与合同金额
               #   非空）/ 到期状态
               # --rules     只跑指定规则，逗号分隔
               # --tolerance 金额比对容差（默认 0.01）
               # --as-of     基准日期（默认今天）
               # 输出：体检汇总 + 问题明细 双 sheet，问题行条件着色
               # 汇总表的「校验行数」是该规则**有数据可校验**的行数 ——
               # 缺数据的行不进分母（既不冒充通过，也不算不通过），
               # 缺关键字段由「关键字段」规则单独统计

  - id: expire
    title: 到期清单
    entry: scripts/contract_toolkit.py expire
    status: implemented
    capabilities:
      - expire  # 按期分档：已到期 / 即将到期 / 正常（未到期）/ 无到期日期
                # --within       提前多少天算「即将到期」（默认 30）
                # --as-of        基准日期（默认今天）
                # --only-expiring 只输出已到期与即将到期
                # --only-dated   排除没有到期日期的记录
                # 输出：到期清单 sheet + 分档统计
                # 无到期日期的记录单独列出，不混进「正常/未到期」——否则用户会
                # 误以为这些合同还有效

  - id: aggregate
    title: 跨合同汇总与一致性比对
    entry: scripts/contract_toolkit.py compare
    status: implemented
    capabilities:
      - compare  # 按分组列（默认 对方名称）汇总：合同数 / 金额合计 / 金额均值 /
                 #   已抽到金额的条数 / 最早到期 / 最晚到期
                 # --fields 指定要统计取值分布的要素列（如 违约金比例,税率），
                 #   输出同一分组内各取值的条数 —— 用于暴露同批合同里
                 #   「同一个对手方签的合同违约金比例居然有两套」这类不一致
                 # 输出：分组汇总 + 要素分布 双 sheet

  - id: runtime
    title: 运行环境
    entry: scripts/contract_toolkit.py info
    status: implemented
    capabilities:
      - info  # 依赖自检（pandas / openpyxl 必需，pypdf / python-docx 可选），
              #   缺失时直接给出 pip 安装命令，不运行到一半才失败
              # 目录摸底：按类型统计各格式文件数与合计（合计 = 目录内实际文件数，
              #   已排除隐藏文件与 .git / node_modules / __pycache__ 等噪声目录），
              #   并单列「需人工处理」的旧版 .doc 与其它不支持格式
              # --probe-text 实际读一遍文件，统计文本层覆盖率与扫描件占比
              # 扫描件识别是本技能的重要前置：文本层为空或过低的 PDF
              # 会在 parse 阶段标记为「未提取」，而不是产出一条空记录
              # 与 parse 同一口径：info 的「合计」= parse 的「处理 N 个文件」
              #   = 台账行数（含不支持格式的行）

lifecycle: draft
icon_url: https://example.com/icon.png
